[project]
name = "a-tag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GlennAde", email = "1519623572@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pupil-apriltags>=1.0.4.post11",
    "pyyaml>=6.0.3",
]

[project.scripts]
a-tag = "a_tag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本机装了 ROS 2 (/opt/ros/humble)，它的 pytest 插件会因缺 lark 而在加载期报错，
# 从而让整个 pytest 起不来。用 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 绕过:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run pytest


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
